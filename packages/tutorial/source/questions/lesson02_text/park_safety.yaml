# ── Lesson 2 of 33: the question text ──────────────────────────────────────────
#
# What this shows: text is what the respondent reads, word for word. A question
# can also carry optional fields: a title, the source it came from, and a note.
#
# To do:
#   1. After  text:  write the question, such as:
#      Do you feel safe in this neighborhood's parks during the day?
