# This workspace's details. They apply to every question, shared file and
# instrument in it.

# The DDI agency: the registered code of the organization that maintains this
# workspace. Every DDI name its questions, shared files and instruments export
# starts with it, as in urn:ddi:org.example:...
# Write your organization's code here: letters, digits and hyphens, in parts
# joined by dots, such as edu.example.dept.
# The DDI Alliance gives out these codes (RFC 9517). To get one, create an
# account at https://registry.ddialliance.org, then choose Manage, then Request
# New Agency. You need an administrative and a technical contact. Approval comes
# by email. The first part is a country code or another top-level domain, as in
# us.example or edu.example. Once it's approved, you can add parts for teams or
# projects (edu.example.dept) under Manage, with no further approval.
agency:

# Fields every question in this workspace must have, as well as name, text and
# intent: any of title, concept, universe, instruction, source and note. A
# question without one shows it as "to fill in". To require a title, remove the
# # at the start of these two lines:
#required:
#  - title

# More fields the questions in one folder must have, by the folder's path. This
# only adds to the fields above. To require a universe in questions/example,
# remove the # at the start of these three lines:
#required_in:
#  questions/example:
#    - universe

# Which version each tag used by this workspace's instruments (owner/name@v1)
# pointed to when it was recorded. A tag can be moved to a new version, so this
# shows when another workspace's questions may have changed under the same tag.
# QREtools writes these lines when you save an instrument, or run
# `qretools instrument export`. Don't edit them. If a tag has moved, you get a
# warning, and the next save records the new version.
locked: {}
