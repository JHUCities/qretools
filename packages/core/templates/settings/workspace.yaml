# This workspace's details, read with every question, shared file and
# instrument in it.

# The DDI agency everything in this workspace is published under, its
# questions, shared files and instruments alike: the registered code of the
# organization that maintains it. Every URN they export begins with it, as in
# urn:ddi:org.example:...
# Write your organization's code here: letters, digits and hyphens, in parts
# joined by dots, such as edu.example.dept.
# The code is assigned by the DDI Alliance (RFC 9517). To register one: create an
# account at https://registry.ddialliance.org, then Manage, then Request New
# Agency, with an administrative and a technical contact; approval comes by
# email. Its first part is a country code or another top-level domain, as in
# us.example or edu.example. Once it's approved, add sub-agencies for teams or
# projects (edu.example.dept) under Manage, with no further approval.
agency:

# Fields every question in this workspace must have, beyond name, text and
# intent: any of title, concept, universe, instruction, source and note. A
# question without one shows it as "to fill in", so adding one here marks every
# question that lacks it. Remove the # at the start of these two lines to
# require a title:
#required:
#  - title

# Fields the questions in one folder must also have, by the folder's path. It
# adds to the fields above and never removes one, so a topic can ask for more.
# Remove the # at the start of these three lines to require a universe of the
# questions in questions/example:
#required_in:
#  questions/example:
#    - universe

# The commit each tag this workspace's instruments use (owner/name@v1) named
# when it was locked. A tag can be moved to another commit, but a commit can't
# change, so a lock shows when another workspace's questions may have changed
# under the same tag. Saving an instrument in QREtools, or exporting it with
# `qretools instrument export`, writes these lines for the tags it reads: you
# don't edit them. A tag that names another commit than its lock is a warning;
# the next save locks it at the new commit, and the change shows here, in
# review, with a [WARNING] in the commit message.
locked: {}
