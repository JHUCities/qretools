# This workspace's details, read with every question, shared file and
# instrument in it.

# The DDI agency everything in this workspace is published under, its
# questions, shared files and instruments alike: the registered code of the
# organization that maintains it. Every URN they export begins with it, as in
# urn:ddi:org.example:...
# Write your organization's code here: letters, digits and hyphens, in parts
# joined by dots, such as edu.example.dept.
agency:

# Fields every question in this workspace must have, beyond name, text and
# intent: any of title, concept, universe, instruction, source and note. A
# question without one shows it as "to fill in", so adding one here marks every
# question that lacks it. Remove the # at the start of these two lines to
# require a title:
#required:
#  - title

# Fields the questions in one folder must also have, by the folder's path. It
# adds to the fields above and never removes one, so a topic can ask for more.
# Remove the # at the start of these three lines to require a universe of the
# questions in questions/example:
#required_in:
#  questions/example:
#    - universe
