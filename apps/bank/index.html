<!doctype html>
<!-- Primer's theme on the root, as github.com does: its colour tokens then apply to the
     whole page, not only inside ThemeProvider's wrapper. -->
<html
  lang="en"
  data-color-mode="auto"
  data-light-theme="light"
  data-dark-theme="dark"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The browser paints the right canvas before the app loads: no white flash in dark mode. -->
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Write survey questions and their documentation, and compose them into instruments, elaborated to DDI-Lifecycle 4.0."
    />
    <title>QREtools</title>
    <!-- A theme chosen on this device, shown before the first paint (key: persist.ts THEME_KEY). -->
    <script>
      try {
        var t = localStorage.getItem("qretools.theme");
        if (t === "light" || t === "dark")
          document.documentElement.setAttribute("data-color-mode", t);
      } catch (e) {}
    </script>
    <!-- The short mark: Radon's Q, outlined, in a square with cut corners; it follows the system's theme. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
