# Publishes the CLI to npm as `qretools` when a tag `cli-v<version>` is pushed. The
# version must be packages/cli/package.json's. npm trusts this workflow (trusted
# publishing, OIDC), so no token is stored, and the package's provenance links it to
# this commit. The trust allows staging only: the release stays private until a
# maintainer approves it with 2FA (`npm stage list qretools`, then
# `npm stage approve <id>`). Every version, prereleases too, goes to the dist-tag
# `latest`, so `npx qretools` runs the newest: there is no stable line yet. (npm needs
# the tag named for a prerelease.)
name: Release CLI

on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Node and pnpm as mise.toml pins them.
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: The tag names the package's version
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          test "$GITHUB_REF_NAME" = "cli-v$version" || {
            echo "Tag $GITHUB_REF_NAME doesn't match packages/cli/package.json's version $version." >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_ENV"
      # `pnpm pack` bundles the command (prepack) and replaces workspace:* with real versions.
      - run: pnpm --dir packages/cli pack --pack-destination "$RUNNER_TEMP/release"
      - name: The packed command runs where it's installed
        run: |
          mkdir "$RUNNER_TEMP/try" && cd "$RUNNER_TEMP/try"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/release/*.tgz
          npx qretools check "$GITHUB_WORKSPACE/packages/core/fixtures/bank"
          npx qretools export "$GITHUB_WORKSPACE/packages/core/fixtures/bank" -o ddi.json
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      - run: npm stage publish "$RUNNER_TEMP"/release/*.tgz --provenance --access public --tag latest
