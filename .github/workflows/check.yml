# Runs on every pull request the checks that the Pages deploy and the CLI release run:
# the tests, the app's build and the command's bundle. A pull request then shows
# whether they pass before it's merged, not after.
name: Check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Node and pnpm as mise.toml pins them.
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm --dir worker install --frozen-lockfile
      - run: pnpm run check:worker
      - run: pnpm run build
      # What `pnpm pack` runs before a release: the command, bundled.
      - run: pnpm --dir packages/cli run bundle
