# Checks every pull request as the Pages deploy and the CLI release check main and a
# release tag: the same checks, the app's build and the command's bundle, so a pull
# request shows whether they pass before it's merged rather than after.
name: Check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Node and pnpm as mise.toml pins them.
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm --dir worker install --frozen-lockfile --ignore-workspace
      - run: pnpm run check:worker
      - run: pnpm run build
      # What `pnpm pack` runs before a release: the command, bundled.
      - run: pnpm --dir packages/cli run bundle
